apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-shared-secret
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollout-shared-secret
  template:
    metadata:
      labels:
        app: rollout-shared-secret
    spec:
      containers:
      - name: rollouts-demo
        image: nginx:1.19-alpine
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
  strategy:
    canary:
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: analysis-shared-secret
      - pause: {}
---
# This secret lives in the dedicated shared-secret namespace configured on the controller via
# --analysis-shared-secret-namespace, NOT in the namespace where the AnalysisRun executes. With strict
# mode on (the default), it must carry the argo-rollouts.argoproj.io/shared-secret label to be readable.
apiVersion: v1
kind: Secret
metadata:
  name: shared-example-secret
  namespace: argo-rollouts
  labels:
    argo-rollouts.argoproj.io/shared-secret: "true"
type: Opaque
data:
  secretUrl: aHR0cHM6Ly9naXN0LmdpdGh1YnVzZXJjb250ZW50LmNvbS9raGhpcmFuaS8yYWIxMTIzMjQwMjUxOGQ1Mjc3YWYwMzBkZDg5MTZkNy9yYXcvZDI3MmY1NTFmMmQxODA2YTAzOTc0ZGJhZWYxMWRmZDU1MTAyZmVlYS9leGFtcGxlLmpzb24=
---
kind: AnalysisTemplate
apiVersion: argoproj.io/v1alpha1
metadata:
  name: analysis-shared-secret
spec:
  args:
  - name: analysis-interval
    value: "5s"
  - name: analysis-runs
    value: "2"
  - name: failure-limit
    value: "1"
  - name: inconclusive-limit
    value: "1"
  - name: secret-url
    valueFrom:
      secretKeyRef:
        name: shared-example-secret
        key: secretUrl
        # Read from the controller's configured shared-secret namespace instead of the AnalysisRun's.
        sharedSecret: true
  metrics:
  - name: webmetric
    count: "{{args.analysis-runs}}"
    interval: "{{args.analysis-interval}}"
    failureLimit: "{{args.failure-limit}}"
    successCondition: result == 'It worked!'
    provider:
      web:
        url: "{{args.secret-url}}"
        jsonPath: "{$.message}"

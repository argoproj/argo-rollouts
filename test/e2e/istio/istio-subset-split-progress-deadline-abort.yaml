apiVersion: v1
kind: Service
metadata:
  name: istio-subset-split-pda
spec:
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: istio-subset-split-pda

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: istio-subset-split-pda-vsvc
spec:
  hosts:
  - istio-subset-split-pda
  http:
  - name: primary
    route:
    - destination:
        host: istio-subset-split-pda
        subset: stable
      weight: 100
    - destination:
        host: istio-subset-split-pda
        subset: canary
      weight: 0

---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: istio-subset-split-pda-destrule
spec:
  host: istio-subset-split-pda
  subsets:
  - name: stable
    labels:
      app: istio-subset-split-pda
  - name: canary
    labels:
      app: istio-subset-split-pda

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: istio-subset-split-pda
spec:
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: istio-subset-split-pda-vsvc
            routes:
            - primary
          destinationRule:
            name: istio-subset-split-pda-destrule
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
      - setWeight: 10
      - pause: {}
  selector:
    matchLabels:
      app: istio-subset-split-pda
  template:
    metadata:
      labels:
        app: istio-subset-split-pda
    spec:
      containers:
      - name: istio-subset-split-pda
        image: nginx:1.19-alpine
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: 16Mi
            cpu: 5m

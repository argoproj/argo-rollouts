apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: rolloutpromotions.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: RolloutPromotion
    listKind: RolloutPromotionList
    plural: rolloutpromotions
    shortNames:
    - rp
    singular: rolloutpromotion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Current execution phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Requested rollout action
      jsonPath: .spec.action
      name: Action
      type: string
    - description: Time since resource was created
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RolloutPromotion requests idempotent lifecycle actions for one
          or more Rollouts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RolloutPromotionSpec describes a single, replay-safe promotion
              request.
            properties:
              action:
                default: promote
                enum:
                - promote
                - promoteFull
                - abort
                - retry
                - rollback
                type: string
              canary:
                description: |-
                  Canary configures how a promote request finishes a canary rollout after
                  the requested manual gate has been opened.
                properties:
                  completionPolicy:
                    default: nextPause
                    description: |-
                      CompletionPolicy controls whether promote stops at the next pause or
                      completes a rollout after it reaches 100% traffic at its final pause.
                      Completing the rollout advances stableRS; old ReplicaSet retention remains
                      controlled by the Rollout's scaleDownDelaySeconds.
                    enum:
                    - nextPause
                    - completeAfterFullWeight
                    type: string
                type: object
              mode:
                default: together
                enum:
                - together
                - sequential
                type: string
              requestID:
                description: |-
                  RequestID identifies one forward lifecycle action. Reapplying a manifest
                  with an already processed ID is a no-op while that ID remains in this CR's history.
                type: string
              rollouts:
                items:
                  description: RolloutPromotionTarget identifies a Rollout and optional
                    safety expectations.
                  properties:
                    activeService:
                      type: string
                    expectedActiveServiceHash:
                      type: string
                    expectedCurrentPodHash:
                      type: string
                    expectedCurrentStepIndex:
                      description: |-
                        ExpectedCurrentStepIndex prevents a stale canary request from advancing a later pause.
                        The pointer preserves step zero as an explicit safety expectation.
                      format: int32
                      minimum: 0
                      type: integer
                    expectedPodTemplateHash:
                      description: |-
                        ExpectedPodTemplateHash is the SHA256 of the JSON encoded spec.template.
                        It binds a request even before status.currentPodHash has been reconciled.
                      type: string
                    expectedRolloutUID:
                      description: |-
                        ExpectedRolloutUID prevents a completed request for an earlier Rollout
                        object from being replayed against a newly created object with the same
                        name and ReplicaSet hash.
                      type: string
                    expectedStableRS:
                      type: string
                    name:
                      minLength: 1
                      type: string
                    namespace:
                      type: string
                    previewService:
                      type: string
                    readiness:
                      description: |-
                        Readiness defers transient preconditions to the controller without relaxing
                        identity or step guards. Omission preserves the legacy request contract.
                      properties:
                        allowedCurrentStepIndexes:
                          items:
                            format: int32
                            type: integer
                          type: array
                          x-kubernetes-list-type: atomic
                        requireCurrentPodHash:
                          type: boolean
                        requirePaused:
                          type: boolean
                      type: object
                    rollbackTarget:
                      description: |-
                        RollbackTarget resolves a dynamic rollback destination. "stable" restores
                        the ReplicaSet currently recorded in Rollout status.stableRS. It is
                        mutually exclusive with ToRevision.
                      enum:
                      - stable
                      type: string
                    strategy:
                      enum:
                      - auto
                      - blueGreen
                      - canary
                      type: string
                    toRevision:
                      format: int64
                      minimum: 0
                      type: integer
                    traffic:
                      description: |-
                        Traffic selects an optional traffic adapter. Omission uses native Rollout
                        actions only. WeightSwitch remains a compatible alias for podAnnotation;
                        setting both is rejected.
                      properties:
                        applyOnPromotion:
                          description: |-
                            ApplyOnPromotion defaults to true. Canary TrafficRouters normally own the
                            forward weight steps, so use false when only snapshot rollback is needed.
                          type: boolean
                        config:
                          additionalProperties:
                            type: string
                          type: object
                        provider:
                          type: string
                      required:
                      - provider
                      type: object
                    weightSwitch:
                      description: |-
                        RolloutPromotionWeightSwitch defines the legacy post-promotion annotation patch.
                        Canary traffic weights are reconciled by the Rollout TrafficRouter instead.
                      properties:
                        activeWeight:
                          type: string
                        annotationKey:
                          type: string
                        applyOnPromotion:
                          default: true
                          description: |-
                            ApplyOnPromotion controls the legacy post-promotion patch. Snapshot traffic
                            rollback still uses this configuration when the value is false.
                          type: boolean
                        baseSelector:
                          type: string
                        enabled:
                          default: false
                          type: boolean
                        inactiveWeight:
                          type: string
                        reapplyDelaySeconds:
                          default: 0
                          format: int32
                          minimum: 0
                          type: integer
                      type: object
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              strategy:
                default: auto
                enum:
                - auto
                - blueGreen
                - canary
                type: string
              trafficRollback:
                description: |-
                  TrafficRollback stores pre-promotion traffic snapshots in status. A
                  rollback request restores the latest snapshot without changing PodTemplate.
                properties:
                  enabled:
                    default: false
                    type: boolean
                  historyLimit:
                    default: 10
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                  mode:
                    default: previousSnapshot
                    enum:
                    - previousSnapshot
                    type: string
                type: object
              wait:
                description: RolloutPromotionWait configures completion polling.
                properties:
                  attempts:
                    default: 180
                    format: int32
                    minimum: 1
                    type: integer
                  enabled:
                    default: true
                    type: boolean
                  seconds:
                    default: 5
                    format: int32
                    minimum: 1
                    type: integer
                type: object
            required:
            - rollouts
            type: object
          status:
            description: RolloutPromotionStatus records the observed result of a promotion
              request.
            properties:
              activeTrafficSnapshotID:
                type: string
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastTrafficRollbackRequest:
                type: string
              observedGeneration:
                format: int64
                type: integer
              operation:
                description: |-
                  Operation is the durable execution record for the currently active request.
                  A controller must persist Committed before changing any Rollout or traffic
                  resource, then resume any non-terminal phase after a restart.
                properties:
                  action:
                    type: string
                  attempt:
                    format: int32
                    type: integer
                  commitTime:
                    format: date-time
                    type: string
                  completionTime:
                    format: date-time
                    type: string
                  id:
                    type: string
                  kind:
                    type: string
                  lastTransitionTime:
                    format: date-time
                    type: string
                  message:
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  phase:
                    enum:
                    - Prepared
                    - Committed
                    - Applying
                    - Verifying
                    - Stalled
                    - Succeeded
                    - Failed
                    type: string
                  requestID:
                    type: string
                required:
                - action
                - id
                - kind
                - phase
                - requestID
                type: object
              phase:
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              processedRequestIDs:
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              startTime:
                format: date-time
                type: string
              targets:
                items:
                  description: RolloutPromotionTargetStatus records the controller-observed
                    state of one target.
                  properties:
                    aborted:
                      type: boolean
                    actionAlreadyComplete:
                      type: boolean
                    actionApplied:
                      type: boolean
                    activeSelector:
                      type: string
                    activeService:
                      type: string
                    activeServiceHash:
                      type: string
                    baselineCurrentPodHash:
                      type: string
                    canaryWeight:
                      format: int32
                      type: integer
                    canaryWeightVerified:
                      type: boolean
                    controllerPause:
                      type: boolean
                    currentPodHash:
                      type: string
                    currentStepAnalysisPhase:
                      type: string
                    currentStepIndex:
                      format: int32
                      type: integer
                    expectedActiveServiceHash:
                      type: string
                    expectedCurrentPodHash:
                      type: string
                    expectedCurrentStepIndex:
                      format: int32
                      type: integer
                    expectedRolloutUID:
                      type: string
                    expectedStableRS:
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    pauseConditions:
                      format: int32
                      type: integer
                    phase:
                      type: string
                    previewService:
                      type: string
                    previousStepIndex:
                      format: int32
                      type: integer
                    promoted:
                      type: boolean
                    resolvedToRevision:
                      format: int64
                      type: integer
                    rollbackTarget:
                      type: string
                    rolloutPhase:
                      type: string
                    rolloutUID:
                      type: string
                    specPaused:
                      type: boolean
                    stableRS:
                      type: string
                    stepCount:
                      format: int32
                      type: integer
                    strategy:
                      type: string
                    toRevision:
                      format: int64
                      type: integer
                    trafficApplied:
                      type: boolean
                    trafficProvider:
                      type: string
                    trafficRollbackApplied:
                      type: boolean
                    trafficRollbackTargetHash:
                      type: string
                    trafficVerified:
                      type: boolean
                    verified:
                      type: boolean
                    weightSwitchActiveHash:
                      type: string
                    weightSwitchActivePods:
                      format: int32
                      type: integer
                    weightSwitchActiveReplicaSets:
                      format: int32
                      type: integer
                    weightSwitchApplied:
                      type: boolean
                    weightSwitchEnabled:
                      type: boolean
                    weightSwitchInactivePods:
                      format: int32
                      type: integer
                    weightSwitchInactiveReplicaSets:
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              trafficSnapshots:
                items:
                  description: |-
                    RolloutPromotionTrafficSnapshot is the serving baseline and restoration state recorded
                    immediately before a forward promotion action.
                  properties:
                    createdAt:
                      format: date-time
                      type: string
                    id:
                      type: string
                    requestID:
                      type: string
                    targets:
                      items:
                        description: |-
                          RolloutPromotionTrafficSnapshotTarget contains enough information to restore
                          traffic to an existing ReplicaSet without changing workload desired state.
                        properties:
                          activeHash:
                            type: string
                          activeWeight:
                            type: string
                          annotationKey:
                            type: string
                          baseSelector:
                            type: string
                          inactiveWeight:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                          reapplyDelaySeconds:
                            format: int32
                            type: integer
                          strategy:
                            type: string
                          traffic:
                            description: |-
                              Traffic is used by new snapshots. The annotation fields below are retained
                              only to read snapshots written by older promotion controllers.
                            properties:
                              config:
                                additionalProperties:
                                  type: string
                                type: object
                              data:
                                additionalProperties:
                                  type: string
                                type: object
                              provider:
                                type: string
                              rolloutUID:
                                type: string
                              version:
                                type: string
                            required:
                            - provider
                            - rolloutUID
                            - version
                            type: object
                        required:
                        - activeHash
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - createdAt
                  - id
                  - targets
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

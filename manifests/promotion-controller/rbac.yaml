apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-rollouts-promotion-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-promotion-controller
rules:
- apiGroups: [argoproj.io]
  resources: [rolloutpromotions]
  verbs: [get, list, watch]
- apiGroups: [argoproj.io]
  resources: [rolloutpromotions/status]
  verbs: [get, patch, update]
- apiGroups: [argoproj.io]
  resources: [rollouts, rollouts/status]
  verbs: [get, list, watch, patch, update]
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, watch, patch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, patch]
- apiGroups: [apps]
  resources: [replicasets, deployments]
  verbs: [get, list, patch]
- apiGroups: [""]
  resources: [podtemplates]
  verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-rollouts-promotion-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-rollouts-promotion-controller
subjects:
- kind: ServiceAccount
  name: argo-rollouts-promotion-controller
  namespace: argo-rollouts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-rollouts-promotion-leader-election
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-rollouts-promotion-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-rollouts-promotion-leader-election
subjects:
- kind: ServiceAccount
  name: argo-rollouts-promotion-controller
  namespace: argo-rollouts
---
# Additional patch permissions for the optional Pod annotation traffic router.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-pod-annotation-router
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, patch]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-rollouts-pod-annotation-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-rollouts-pod-annotation-router
subjects:
- kind: ServiceAccount
  name: argo-rollouts
  namespace: argo-rollouts
